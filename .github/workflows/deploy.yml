name: Deploy Downsell Pilates

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do React (Vite)
        run: npm run build

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy para S3 (cache longo)
        run: |
          aws s3 sync dist/ s3://pilatesdacavala/downsell \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://pilatesdacavala/downsell/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidar cache do CloudFront
        run: |
          for i in 1 2 3; do
            aws cloudfront create-invalidation \
              --distribution-id E1KUI788CASJJN \
              --paths "/downsell/*" && break
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
